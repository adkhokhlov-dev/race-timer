<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>&#9955; Timer</title>
  <!-- <link rel="icon" href="favicon.ico" type="image/x-icon" /> -->
  <!-- <link rel="icon" href="data:image/svg+xml;utf8,😊" /> -->


  <link rel="stylesheet" href="styles.css" />
  <script src="alpine.min.js" defer></script>
  <script type="text/javascript" src="timer.js"></script>
</head>

<body>
  <div x-data="timer()" x-init="init()" class="app">
    <div class="settings">
      <div>
        <!-- <label>
            Старт
            <input
              type="time"
              x-model="start"
              required
              placeholder="Время старта"
            /> </label
          ><label> -->

        <select x-model="selectedRace" @change="onRaceChange($event.target.value)" placeholder="гонка">
          <template x-for="option in races" :key="option.name">
            <option :value="option.name" x-text="option.name"></option>
          </template>
        </select>

        <button @click="addRace()">+</button>
        <button @click="editRace()">
          <img src="assets/edit.svg" />
        </button>

        <label>
          <!-- Интервал -->
          <input type="number" x-model="interval" required placeholder="Начальное отставание в с" :readonly="!editMode"
            class="input-interval" />
        </label>

        <button @click="resetRace()"> <img src="assets/reset.svg" /></button>
      </div>
      <!--    <div>
        <input type="number" x-model="number" required placeholder="Номер" />
        <input type="text" x-model="name" placeholder="Участник" />
        <button>Добавить</button>
      </div> -->
      </form>


      <div class="header row">
        <div>Участник</div>
        <!-- <div>Круг</div> -->
        <template x-for="l in laps">
          <div><span>этап </span><span x-text="l"></span></div>
        </template>
      </div>

      <template x-for="p in participantsSorted" :key="p.id">
        <div @click="check(p.id)" class="row">
          <div>
            <template x-if="editMode">
              <button @click="deleteRacer(p.id)">-</button>
            </template>
            <b x-text="p.id"></b>
            <span x-text="p.name"></span>
          </div>
          <!-- <span x-text="p.laps.length"></span> -->
          <template x-for="lap in p.laps">
            <div :style="getColor(lap.position);">
              <div>место:<span x-text="lap.position"></span></div>
              <template x-for="delay in lap.delays">
                <div>
                  <!-- <span>отставание: </span> --><span x-text="delay"></span>
                </div>
                <!-- <div><span>отставание: </span><span x-text="delay"></span></div> -->
              </template>
            </div>
          </template>
        </div>
      </template>

      <template x-if="editMode">
        <div class="button-group">
          <button @click="addParticipants()">+ добавить участников</button>
          <button @click="saveRace(true)">Сохранить</button>
          <button @click="deleteRace()">удалить</button>
        </div>
    </div>
  </div>
</body>

</html>
