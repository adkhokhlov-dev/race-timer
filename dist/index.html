<body>

    <div class="settings">
      <div>

        <select x-model="selectedRace" @change="onRaceChange($event.target.value)" placeholder="гонка">
          <template x-for="option in races" :key="option.name">
            <option :value="option.name" x-text="option.name"></option>
          </template>
        </select>

        <button @click="addRace()">+</button>
        <button @click="editRace()">
          <img src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20height='24px'%20viewBox='0%20-960%20960%20960'%20width='24px'%20fill='%23e3e3e3'%3e%3cpath%20d='M200-200h57l391-391-57-57-391%20391v57Zm-80%2080v-170l528-527q12-11%2026.5-17t30.5-6q16%200%2031%206t26%2018l55%2056q12%2011%2017.5%2026t5.5%2030q0%2016-5.5%2030.5T817-647L290-120H120Zm640-584-56-56%2056%2056Zm-141%2085-28-29%2057%2057-29-28Z'/%3e%3c/svg%3e" />
        </button>

        <label>
          <!-- Интервал -->
          <input type="number" x-model="interval" required placeholder="Начальное отставание в с" :readonly="!editMode"
            class="input-interval" />
        </label>

        <button @click="resetRace()"> <img src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20height='24px'%20viewBox='0%20-960%20960%20960'%20width='24px'%20fill='%23e3e3e3'%3e%3cpath%20d='M480-120q-138%200-240.5-91.5T122-440h82q14%20104%2092.5%20172T480-200q117%200%20198.5-81.5T760-480q0-117-81.5-198.5T480-760q-69%200-129%2032t-101%2088h110v80H120v-240h80v94q51-64%20124.5-99T480-840q75%200%20140.5%2028.5t114%2077q48.5%2048.5%2077%20114T840-480q0%2075-28.5%20140.5t-77%20114q-48.5%2048.5-114%2077T480-120Zm112-192L440-464v-216h80v184l128%20128-56%2056Z'/%3e%3c/svg%3e" /></button>
      </div>
      <!--    <div>
        <input type="number" x-model="number" required placeholder="Номер" />
        <input type="text" x-model="name" placeholder="Участник" />
        <button>Добавить</button>
      </div> -->
      </form>


      <div class="header row">
        <div>Участник</div>
        <template x-for="l in laps">
          <div><span>этап </span><span x-text="l"></span></div>
        </template>
      </div>

      <template x-for="p in participantsSorted" :key="p.id">
        <div @click="check(p.id)" class="row">
          <div>
            <template x-if="editMode">
              <button @click="deleteRacer(p.id)">-</button>
            </template>
            <b x-text="p.id"></b>
            <span x-text="p.name"></span>
          </div>
          <!-- <span x-text="p.laps.length"></span> -->
          <template x-for="lap in p.laps">
            <div :style="getColor(lap.position);">
              <div>место:<span x-text="lap.position"></span></div>
              <template x-for="delay in lap.delays">
                <div>
                  <!-- <span>отставание: </span> --><span x-text="delay"></span>
                </div>
                <!-- <div><span>отставание: </span><span x-text="delay"></span></div> -->
              </template>
            </div>
          </template>
        </div>
      </template>

      <template x-if="editMode">
        <div class="button-group">
          <button @click="addParticipants()">+ добавить участников</button>
          <button @click="saveRace(true)">Сохранить</button>
          <button @click="deleteRace()">удалить</button>
        </div>
      </template>

    </div>
  </div>

</body>
